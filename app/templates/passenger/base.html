<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      WaveTech - {% block title %}Passenger Portal{% endblock %}
    </title>
    
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/wavetech_logo.png') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link
      href="{{ url_for('static', filename='css/custom.css') }}"
      rel="stylesheet"
    />

    <link
      href="{{ url_for('static', filename='css/passenger.css') }}"
      rel="stylesheet"
    />

    <link
      href="{{ url_for('static', filename='css/passenger_home.css') }}"
      rel="stylesheet"
    />
  </head>

  <body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg px-3 px-lg-4">
      <div class="container-fluid p-0">

        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold"
          href="{{ url_for('passenger.home') }}">
          <img
    src="{{ url_for('static', filename='images/wavetech_horizontal_logo.png') }}"
    alt="WaveTech"
  />
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#passengerNav"
                aria-controls="passengerNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="passengerNav">
          <div class="passenger-nav ms-auto">

            <a href="{{ url_for('passenger.home') }}"
              class="passenger-nav-link {% if active_page == 'home' %}active{% endif %}">
              Home
            </a>

            <a href="{{ url_for('passenger.schedule') }}"
              class="passenger-nav-link {% if active_page == 'schedule' or request.endpoint == 'passenger.schedule' %}active{% endif %}">
                Schedule
            </a>

            <a
              href="{{ url_for('passenger.register_page') }}"
              class="passenger-nav-link {% if active_page == 'register' or request.endpoint in ['passenger.register_page', 'passenger.registration_status_page'] %}active{% endif %}"
          >
              Register
          </a>

            <a href="{{ url_for('passenger.guide') }}"
              class="passenger-nav-link {% if active_page == 'guide' %}active{% endif %}">
              Guide
            </a>

          </div>
        </div>

      </div>
    </nav>

    <!-- PAGE CONTENT -->
    <main>
      {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="text-center text-muted small py-4 border-top">
      &copy; 2026 Laguna de Bay WaveTech. All rights reserved.
    </footer>


    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- PAGE-SPECIFIC JAVASCRIPT -->
    {% block scripts %}{% endblock %}

  </body>
</html>
