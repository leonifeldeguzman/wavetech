<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaveTech - {% block title %}Passenger Portal{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/custom.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg bg-white border-bottom px-3 px-lg-4 py-3"
    >
      <div class="container-fluid p-0">
        <a
          class="navbar-brand d-flex align-items-center gap-2 fw-bold"
          href="{{ url_for('passenger.home') }}"
          style="color: var(--navy)"
        >
          <i class="bi bi-sign-turn-right-fill fs-4"></i> WaveTech
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#passengerNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="passengerNav">
          <div
            class="d-flex flex-column flex-lg-row gap-3 gap-lg-4 ms-auto mt-3 mt-lg-0"
          >
            <a
              href="{{ url_for('passenger.home') }}"
              class="text-decoration-none fw-semibold {% if active_page == 'home' %}border-bottom border-2{% endif %}"
              style="color: var(--navy)"
            >
              Home
            </a>
            <a
              href="{{ url_for('passenger.schedule') }}"
              class="text-decoration-none fw-semibold {% if active_page == 'schedule' %}border-bottom border-2{% endif %}"
              style="color: var(--navy)"
            >
              Schedule
            </a>
            <span class="text-muted fw-semibold" style="cursor: not-allowed"
              >Register</span
            >
            <span class="text-muted fw-semibold" style="cursor: not-allowed"
              >Guide</span
            >
          </div>
        </div>
      </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer class="text-center text-muted small py-4 mt-5 border-top">
      &copy; 2026 Laguna de Bay WaveTech. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
