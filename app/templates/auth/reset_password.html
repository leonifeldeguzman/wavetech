{% extends "auth/_auth_base.html" %}
{% block title %}New Password{% endblock %}
{% block heading %}New Password{% endblock %}
{% block subtitle %}Choose a new password (at least 8 characters).{% endblock %}

{% block content %}
<form method="POST" class="text-start">
  <div class="mb-3 position-relative">
    <input type="password" name="new_password" id="new_password" class="form-control pe-5"
           placeholder="New password" required minlength="8" autocomplete="new-password" />
    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 p-0 me-3"
            style="color:#6b7280" onclick="togglePassword('new_password', this)" aria-label="Show password">
      <i class="bi bi-eye"></i>
    </button>
  </div>
  <div class="mb-4 position-relative">
    <input type="password" name="confirm_password" id="confirm_password" class="form-control pe-5"
           placeholder="Confirm new password" required minlength="8" autocomplete="new-password" />
    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 p-0 me-3"
            style="color:#6b7280" onclick="togglePassword('confirm_password', this)" aria-label="Show password">
      <i class="bi bi-eye"></i>
    </button>
  </div>
  <button type="submit" class="btn w-100 main-btn">Update Password</button>
</form>
{% endblock %}

{% block scripts %}
<script>
  function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector("i");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    icon.classList.toggle("bi-eye", !show);
    icon.classList.toggle("bi-eye-slash", show);
  }
</script>
{% endblock %}
