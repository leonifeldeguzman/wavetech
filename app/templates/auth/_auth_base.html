<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaveTech - {% block title %}{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/wavetech_logo.png') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh; margin: 0;
      background: linear-gradient(rgba(15,27,60,.55), rgba(15,27,60,.55)),
        url("/static/images/laguna_lake.jpg") center center / cover no-repeat;
      font-family: "Inter", sans-serif;
    }
    .login-card {
      width: 100%; max-width: 390px; margin: 20px; padding: 0 !important;
      background: rgba(255,255,255,.97); border: none !important; border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.08);
    }
    .login-card .card-body { padding: 38px 38px 36px; }
    .login-logo { width: 100px; height: 100px; display: block; margin: 0 auto 12px; object-fit: contain; }
    .login-card h5 { color: var(--navy); font-size: 1.35rem; font-weight: 700; margin-bottom: 8px !important; }
    .auth-sub { color: #6b7280; font-size: .85rem; margin-bottom: 24px; }
    .login-card .form-control {
      height: 46px; padding: 0 14px; background-color: #f5f6f8 !important;
      border: 1px solid #e5e7eb !important; border-radius: 9px; font-size: .9rem; box-shadow: none !important;
    }
    .login-card .form-control:focus {
      background-color: #fff !important; border-color: var(--navy) !important;
      box-shadow: 0 0 0 3px rgba(15,27,60,.08) !important;
    }
    .otp-input { text-align: center; letter-spacing: .6em; font-size: 1.3rem !important; font-weight: 700; }
    .login-card .alert { padding: 10px 12px; border: none; border-radius: 8px; font-size: .82rem; margin-bottom: 20px; }
    .login-card .main-btn {
      height: 46px; border: none; border-radius: 9px; background-color: var(--navy) !important;
      font-size: .9rem; font-weight: 600; color: #fff; box-shadow: 0 4px 10px rgba(15,27,60,.18);
      transition: background-color .15s ease, transform .15s ease;
    }
    .login-card .main-btn:hover { background-color: var(--navy-dark) !important; transform: translateY(-1px); color: #fff; }
    .auth-link { color: #6b7280; font-size: .8rem; text-decoration: none; background: none; border: 0; padding: 0; }
    .auth-link:hover { color: var(--navy); text-decoration: underline; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div class="card login-card">
    <div class="card-body text-center">
      <img src="{{ url_for('static', filename='images/wavetech_vertical_logo.png') }}" alt="WaveTech Logo" class="login-logo" />
      <h5>{% block heading %}{% endblock %}</h5>
      <p class="auth-sub">{% block subtitle %}{% endblock %}</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category in ['success','danger','info'] else 'danger' }} text-start">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
