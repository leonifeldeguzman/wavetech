{% extends "auth/_auth_base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block heading %}Forgot Password{% endblock %}
{% block subtitle %}Enter your Admin ID and we'll email you a 6-digit code.{% endblock %}

{% block content %}
<form method="POST" class="text-start">
  <div class="mb-3">
    <input type="text" name="admin_id" class="form-control" placeholder="Admin ID" required autofocus />
  </div>
  <button type="submit" class="btn w-100 main-btn">Send Code</button>
  <div class="text-center mt-3">
    <a href="{{ url_for('auth.login') }}" class="auth-link">Back to login</a>
  </div>
</form>
{% endblock %}
