<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveTech - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(15,27,60,0.55), rgba(15,27,60,0.55)),
                        url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21?q=80&w=1600') center/cover no-repeat;
            min-height: 100vh;
        }
        .login-card {
            max-width: 380px;
            width: 100%;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="card login-card shadow-lg border-0 p-4">
        <div class="card-body text-center">
            <i class="bi bi-sign-turn-right-fill fs-1" style="color: var(--navy);"></i>
            <h4 class="fw-bold mt-2 mb-4">Admin Login</h4>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 text-start">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="text-start">
                <div class="mb-3">
                    <label class="form-label small text-muted">Admin ID</label>
                    <input type="text" name="admin_id" class="form-control bg-light border-0" placeholder="Admin ID" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted">Password</label>
                    <input type="password" name="password" class="form-control bg-light border-0" placeholder="Password" required>
                </div>
                <button type="submit" class="btn w-100 text-white" style="background-color: var(--navy);">
                    Login
                </button>
            </form>
        </div>
    </div>

</body>
</html>
