<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaveTech - Admin Login</title>
    
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/wavetech_logo.png') }}"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/custom.css') }}"
      rel="stylesheet"
    />
    <style>
  /* =========================
     LOGIN PAGE
     ========================= */

  body {
    min-height: 100vh;
    margin: 0;

    background:
      linear-gradient(rgba(15, 27, 60, 0.55), rgba(15, 27, 60, 0.55)),
      url("/static/images/laguna_lake.jpg")
        center center / cover no-repeat;

    font-family: "Inter", sans-serif;
  }

  /* =========================
     LOGIN CARD
     ========================= */

  .login-card {
    width: 100%;
    max-width: 390px;

    margin: 20px;
    padding: 0 !important;

    background: rgba(255, 255, 255, 0.97);
    border: none !important;
    border-radius: 18px;

    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.22),
      0 4px 12px rgba(0, 0, 0, 0.08);

    overflow: hidden;
  }

  .login-card .card-body {
    padding: 38px 38px 36px;
  }

  /* =========================
     LOGO
     ========================= */

  .login-logo {
    width: 115px;
    height: 115px;

    display: block;
    margin: 0 auto 12px;

    object-fit: contain;
  }

  /* =========================
     TITLE
     ========================= */

  .login-card h5 {
    margin-top: 0 !important;
    margin-bottom: 30px !important;

    color: var(--navy);

    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* =========================
     FORM
     ========================= */

  .login-card .form-label {
    margin-bottom: 7px;

    color: #374151 !important;

    font-size: 0.82rem;
    font-weight: 600;
  }

  .login-card .mb-3 {
    margin-bottom: 20px !important;
  }

  .login-card .mb-4 {
    margin-bottom: 25px !important;
  }

  /* =========================
     INPUTS
     ========================= */

  .login-card .form-control {
    height: 46px;

    padding: 0 14px;

    background-color: #f5f6f8 !important;

    border: 1px solid #e5e7eb !important;
    border-radius: 9px;

    color: #111827;

    font-size: 0.9rem;

    box-shadow: none !important;

    transition:
      border-color 0.15s ease,
      background-color 0.15s ease,
      box-shadow 0.15s ease;
  }

  .login-card .form-control::placeholder {
    color: #9ca3af;
  }

  .login-card .form-control:hover {
    background-color: #f9fafb !important;
    border-color: #d1d5db !important;
  }

  .login-card .form-control:focus {
    background-color: #ffffff !important;
    border-color: var(--navy) !important;

    box-shadow:
      0 0 0 3px rgba(15, 27, 60, 0.08) !important;
  }

  /* =========================
     PASSWORD TOGGLE
     ========================= */

  .login-card .position-relative .btn {
    color: #9ca3af !important;

    transition: color 0.15s ease;
  }

  .login-card .position-relative .btn:hover {
    color: var(--navy) !important;
  }

  .login-card .position-relative .btn:focus {
    box-shadow: none !important;
  }

  .login-card .position-relative i {
    font-size: 1rem;
  }

  /* =========================
     FLASH MESSAGE
     ========================= */

  .login-card .alert {
    margin-bottom: 20px;

    padding: 10px 12px;

    border: none;
    border-radius: 8px;

    font-size: 0.82rem;
  }

  /* =========================
     LOGIN BUTTON
     ========================= */

  .login-card form > button {
    height: 46px;

    border: none;
    border-radius: 9px;

    background-color: var(--navy) !important;

    font-size: 0.9rem;
    font-weight: 600;

    letter-spacing: 0.01em;

    box-shadow:
      0 4px 10px rgba(15, 27, 60, 0.18);

    transition:
      background-color 0.15s ease,
      transform 0.15s ease,
      box-shadow 0.15s ease;
  }

  .login-card form > button:hover {
    background-color: var(--navy-dark) !important;

    transform: translateY(-1px);

    box-shadow:
      0 6px 14px rgba(15, 27, 60, 0.22);
  }

  .login-card form > button:active {
    transform: translateY(0);
  }

  /* =========================
     RESPONSIVE
     ========================= */

  @media (max-width: 480px) {

    body {
      background-position: center;
    }

    .login-card {
      max-width: 360px;
      margin: 16px;
      border-radius: 16px;
    }

    .login-card .card-body {
      padding: 32px 26px 30px;
    }

    .login-logo {
      width: 100px;
      height: 100px;
      margin-bottom: 10px;
    }

    .login-card h5 {
      font-size: 1.25rem;
      margin-bottom: 26px !important;
    }
  }

  @media (max-width: 360px) {

    .login-card .card-body {
      padding: 28px 22px;
    }

    .login-logo {
      width: 90px;
      height: 90px;
    }
  }
</style>
  </head>
  <body class="d-flex align-items-center justify-content-center">
    <div class="card login-card shadow-lg border-0 p-4">
      <div class="card-body text-center">
        <img
        src="{{ url_for('static', filename='images/wavetech_vertical_logo.png') }}"
        alt="WaveTech Logo"
        class="login-logo"
      />
        <h5 class="fw-bold mt-2 mb-4">Admin Login</h5>

        {% with messages = get_flashed_messages() %} {% if messages %} {% for
        message in messages %}
        <div class="alert alert-danger py-2 text-start">{{ message }}</div>
        {% endfor %} {% endif %} {% endwith %}

        <form method="POST" class="text-start">
          <div class="mb-3">
            <label class="form-label small text-muted">Admin ID</label>
            <input
              type="text"
              name="admin_id"
              class="form-control bg-light border-0"
              placeholder="Admin ID"
              required
            />
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">Password</label>

            <div class="position-relative">
              <input
                type="password"
                name="password"
                id="password"
                class="form-control bg-light border-0 pe-5"
                placeholder="Password"
                required
                autocomplete="current-password"
              />

              <button
                type="button"
                class="btn position-absolute top-50 end-0 translate-middle-y border-0 p-0 me-3"
                style="color: #6b7280"
                onclick="togglePassword('password', this)"
                aria-label="Show password"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button
            type="submit"
            class="btn w-100 text-white"
            style="background-color: var(--navy)"
          >
            Login
          </button>
        </form>
      </div>
    </div>
    <script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector("i");

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
            button.setAttribute("aria-label", "Hide password");
        } else {
            input.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
            button.setAttribute("aria-label", "Show password");
        }
    }
</script>
  </body>
</html>
